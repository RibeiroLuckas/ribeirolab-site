<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Página não encontrada | RibeiroLab</title>
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      background: #0a0a0f; color: #e2e8f0; font-family: 'Space Grotesk', system-ui, sans-serif; text-align: center;
      background-image: linear-gradient(rgba(124,58,237,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(124,58,237,.05) 1px, transparent 1px);
      background-size: 50px 50px; }
    .code { font-size: clamp(5rem, 20vw, 9rem); font-weight: 700; line-height: 1; margin: 0;
      background: linear-gradient(135deg, #a855f7, #3b82f6 50%, #06b6d4); -webkit-background-clip: text; background-clip: text; color: transparent; }
    h1 { font-size: 1.75rem; color: #fff; margin: 1rem 0 .5rem; }
    p { color: #cbd5e1; max-width: 28rem; margin: 0 auto 2rem; line-height: 1.6; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    a { display: inline-block; padding: 14px 28px; border-radius: 999px; font-weight: 700; text-decoration: none; }
    .primary { background: linear-gradient(90deg, #a855f7, #3b82f6); color: #fff; }
    .ghost { border: 1px solid rgba(255,255,255,.2); color: #fff; }
    a:focus-visible { outline: 2px solid #a78bfa; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Página não encontrada</h1>
    <p>O endereço que você acessou não existe ou mudou de lugar. Que tal voltar para o início ou falar direto com a gente?</p>
    <div class="actions">
      <a class="primary" href="/">Voltar ao início</a>
      <a class="ghost" href="https://wa.me/5511965019133" target="_blank" rel="noopener noreferrer">Falar no WhatsApp</a>
    </div>
  </main>
</body>
</html>
